name: health_keeper
description: A premium health tracking application for families.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  camera: ^0.12.0+2
  google_mlkit_text_recognition: ^0.16.0
  image: ^4.9.1
  path_provider: ^2.1.4
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

