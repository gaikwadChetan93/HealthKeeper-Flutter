name: health_keeper
description: A premium health tracking application for families.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  file_picker: ^13.4.1
  http_parser: ^4.1.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
